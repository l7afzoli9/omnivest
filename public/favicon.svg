<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep slate / modern fintech dark theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <!-- Outer Ring / Glow Gradients -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Chart Wave Gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Chart Fill Area -->
    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="14" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Candlesticks / Stocks representation (Background grid pulse) -->
  <!-- Red / Bearish Candlestick -->
  <g opacity="0.85">
    <line x1="16" y1="20" x2="16" y2="38" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="14" y="24" width="4" height="9" rx="1" fill="#f43f5e"/>
  </g>

  <!-- Green / Bullish Candlestick -->
  <g opacity="0.9">
    <line x1="28" y1="15" x2="28" y2="37" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="26" y="19" width="4" height="11" rx="1" fill="#10b981"/>
  </g>

  <!-- Candlestick 3 (Crypto surge candle) -->
  <g opacity="0.85">
    <line x1="40" y1="12" x2="40" y2="30" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="38" y="15" width="4" height="8" rx="1" fill="#10b981"/>
  </g>

  <!-- Chart Trend Area & Line (Market trajectory) -->
  <path d="M 8 45 Q 20 44, 26 34 T 44 26 T 56 14 L 56 50 L 8 50 Z" fill="url(#chartAreaGrad)"/>
  <path d="M 8 45 Q 20 44, 26 34 T 44 26 T 56 14" fill="none" stroke="url(#chartGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)"/>

  <!-- Dynamic Uptrend Marker / Pulse Radar -->
  <circle cx="56" cy="14" r="3" fill="#10b981" filter="url(#glow)"/>
  <circle cx="56" cy="14" r="1.5" fill="#ffffff"/>

  <!-- Badges / Currency Symbols overlay at lower quadrant representing Forex & Crypto -->
  <!-- Floating Glass Capsule Backdrop for Currencies -->
  <rect x="10" y="40" width="44" height="17" rx="8.5" fill="#0b1329" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>

  <!-- Forex Currency: Currency Exchange Loop / Euro-Dollar vibe ($ / €) -->
  <!-- Dollar Symbol (Forex) -->
  <g transform="translate(19, 48.5)">
    <text text-anchor="middle" dominant-baseline="central" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900">$</text>
  </g>

  <!-- Exchange arrows indicator between Forex & Crypto -->
  <path d="M 27 46.5 L 31 46.5 M 30 44.5 L 32 46.5 L 30 48.5" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 33 50.5 L 29 50.5 M 30 52.5 L 28 50.5 L 30 48.5" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Crypto Symbol (Bitcoin / Token vibe '₿' style) -->
  <g transform="translate(43, 48.5)">
    <!-- Stylized crypto currency symbol -->
    <text text-anchor="middle" dominant-baseline="central" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900">₿</text>
  </g>
</svg>
